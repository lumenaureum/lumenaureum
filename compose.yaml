# Lumen Aureum. Before the first start:
#   1. Set LUMENAUREUM_HOST_IP to the address your computers use to reach this machine, in a file named .env next to
#      this one:   LUMENAUREUM_HOST_IP=192.168.1.10
#      No .env file (a NAS app screen such as TrueNAS "Install via YAML")? Write the address straight into the
#      ports line instead:   - "192.168.1.10:8780:8780"
#      A machine with more than one network (a separate storage network) must use the address on the network your
#      computers are on.
#   2. Set "user" below to the user that owns your data, vault and photos folders.
#   3. Point the /vault line at a folder on a different disk from your data folder. A NAS with a single pool: a
#      separate dataset is fine; then add a second backup copy in another place (Settings), which is what protects you.
# Then: docker compose up -d, and open https://<that address>:8780 from another device on your network.
services:
  lumenaureum:
    image: ghcr.io/lumenaureum/lumenaureum:1.5.2     # a fixed version; change it deliberately to upgrade
    restart: unless-stopped
    user: "10001:10001"                              # the user and group that own the folders below
    ports:
      - "${LUMENAUREUM_HOST_IP:?Set LUMENAUREUM_HOST_IP to this machine's address on your network}:8780:8780"
    volumes:
      - ./data:/data                                 # database, keyring, settings
      - /path/to/another/disk/lumenaureum-vault:/vault     # backups: a different disk or dataset from ./data
      - ./photos:/photos                             # uploaded RAWs and exports, stored encrypted: make room for them
    # The app sees only the folders listed here. To use another folder on this machine, add a line and type the name
    # after the colon in setup (docs/where-it-runs.md, Folders outside the container). Give it the owner in "user".
    #  - /mnt/usb-backup/lumenaureum:/backup2              # a second backup copy on another disk: type /backup2 in setup
    #  - /srv/www/galleries:/galleries               # a folder a web server here serves: type /galleries in setup
    # Settings such as CRM_ALLOW_ONLY are lines under environment: (docs/where-it-runs.md, Settings in compose.yaml).
    # environment:
    #   CRM_ALLOW_ONLY: "192.168.1.0/24"             # only these addresses may connect
    #   CRM_HOSTNAMES: "nas.local"                   # names you reach it by, besides its address
    #   CRM_TLS_SAN: "192.168.1.10,nas.local"        # put these in the certificate, so the browser asks only once;
    #                                                  # adding one later makes a new certificate at the next start
    ulimits:
      core: 0                                        # no core dumps: a crash never writes memory (keys, client data) to disk
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
