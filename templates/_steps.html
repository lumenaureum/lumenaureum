
{% macro switch(k, r) -%}
{% if r.locked %}<button type="button" class="ui-btn ui-btn-quiet step-sw" disabled title="{{ r.locked }}">Turn off</button> <small class="mute">{{ r.locked }}</small>
{%- else %}<input type="hidden" name="{{ k }}_on" value="{{ '0' if r.off else '1' }}" data-step-on><button type="button" class="ui-btn ui-btn-quiet step-sw" data-step-sw aria-pressed="{{ 'false' if r.off else 'true' }}"{% if r.warn %} data-warn="{{ r.warn }}"{% endif %} aria-label="{{ ('Turn on ' if r.off else 'Turn off ') ~ r.label }}">{{ 'Turn on' if r.off else 'Turn off' }}</button>{% endif %}
{%- endmacro %}

{% macro reuse_lines(items) -%}

{% if items %}<div class="reuse">{% for it in items %}<button type="button" class="ui-btn ui-btn-inline reuse-chip" data-fill="{{ it.fill|tojson|forceescape }}" title="Use {{ it.names }}'s answer: {{ it.full }}">Match {{ it.names }}: {{ it.short }}</button>{% endfor %}</div>{% endif %}
{%- endmacro %}
