


{% macro pager(prev_href, prev_label, current, next_href, next_label, label='') -%}
<nav class="ui-pager"{% if label %} aria-label="{{ label }}"{% endif %}><a class="ui-go ui-pager-step" href="{{ prev_href }}" rel="prev">&lsaquo; {{ prev_label }}</a>
<b class="ui-pager-now" aria-current="page">{{ current }}</b>
<a class="ui-go ui-pager-step" href="{{ next_href }}" rel="next">{{ next_label }} &rsaquo;</a>{% if caller %}{{ caller() }}{% endif %}</nav>
{%- endmacro %}
