# Every push and pull request: tests, dependency CVE scan, secret scan over the full history, image build and scan.
# A version tag (v1.2.3) also publishes the image to ghcr.io and signs it, after a maintainer approves the
# "release" environment (Settings > Environments > release > required reviewers). Every action is pinned by commit.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b   # v5.3.0
        with: { python-version: "3.13" }
      - name: System libraries for PDFs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation poppler-utils
      - name: Install (locked, hash-checked)
        run: pip install --require-hashes --no-deps -r requirements.lock && pip install --require-hashes -r requirements-ci.lock
      - name: Tests
        run: python -m pytest -q -rs tests/
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: Secrets anywhere in the history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 git /repo --redact --exit-code 1
  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - name: Build
        run: docker build --build-arg LUMEN_BUILD=${GITHUB_SHA::7} -t lumen:ci .
      - name: Scan the image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8   # v0.36.0
        with: { image-ref: "lumen:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    environment: release            # a maintainer must approve each release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da   # v3.7.0 (verifies cosign's checksum)
      - name: Build the release image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          test "$VERSION" = "$(cat VERSION)" || { echo "tag $VERSION does not match VERSION file"; exit 1; }
          docker build --build-arg LUMEN_BUILD=${GITHUB_SHA::7} -t lumen:release .
      - name: Scan the exact image that will be published
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8   # v0.36.0
        with: { image-ref: "lumen:release", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - name: Publish and sign that image
        env:
          IMAGE: ghcr.io/lumenaureum/lumenaureum
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker tag lumen:release $IMAGE:$VERSION
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push $IMAGE:$VERSION
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:$VERSION)
          cosign sign --yes "$DIGEST"
          echo "Published $DIGEST" >> "$GITHUB_STEP_SUMMARY"
