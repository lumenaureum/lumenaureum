name: ci
on:
  push:
    branches: [main, candidate]   # candidate: a release snapshot tested here before main and the tag move
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with: { python-version: "3.13" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0 (the gallery page and inquiry script tests)
        with: { node-version: "20" }
      - name: System libraries for PDFs, and PHP for the host scripts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation poppler-utils php-cli
      - name: Install (locked, hash-checked)
        run: pip install --require-hashes --no-deps -r requirements.lock && pip install --require-hashes -r requirements-ci.lock
      - name: PHP and Node are here (their tests fail, never skip, without them)
        run: php --version && node --version
      - name: Tests (${{ matrix.arch }})
        env: { LA_REQUIRE_TOOLS: "1" }     # a test that needs php or node fails when it is missing (tests/helpers_tools.py)
        run: python -m pytest -q -rsR -n auto --dist loadfile --reruns 1 tests/   # one worker per core; a file keeps its order; a test that fails once is retried once and listed as a rerun (-rR); failing twice fails the run
      - name: Host scripts on the PHP floor (7.4) and the newest PHP (8.5)
        if: matrix.arch == 'amd64'
        run: |
          for img in php:7.4-cli@sha256:620a6b9f4d4feef2210026172570465e9d0c1de79766418d3affd09190a7fda5 \
                     php:8.5-cli@sha256:50956f094e90a716d43bea28087d447555ad80510e386ab8c9c10d8c70d781a9; do
            out=$(docker run --rm -v "$PWD:/w:ro" -w /w "$img" sh -c 'for f in plugins/gallery_assets/*.php plugins/studio_assets/*.php plugins/sealed_assets/*.php; do php -l "$f" >/dev/null || exit 1; done; php tests/sealed_vectors.php tests/vectors/sealed-v1.json')
            echo "$out"
            echo "$out" | grep -q '"fail":\[\]' || { echo "the sealed-format vectors failed on $img"; exit 1; }
          done
      - name: Known vulnerabilities in dependencies
        if: matrix.arch == 'amd64'
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: Secrets anywhere in the history
        if: matrix.arch == 'amd64'
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 git /repo --redact --exit-code 1
  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Build (${{ matrix.arch }})
        run: |
          docker build --build-arg LUMENAUREUM_BUILD=${GITHUB_SHA::7} -t lumenaureum:ci .
          test "$(docker image inspect --format '{{.Architecture}}' lumenaureum:ci)" = "${{ matrix.arch }}"
      - name: Scan the image (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8   # v0.36.0
        with: { image-ref: "lumenaureum:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    strategy:
      fail-fast: true                 # one platform failing stops the other; the tag people pull is never made
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    environment: release            # a maintainer must approve each release (one approval covers both platforms)
    permissions:
      contents: read
      packages: write
      id-token: write                 # the attestations below are signed with this workflow's own identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Build the release image (${{ matrix.arch }})
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          test "$VERSION" = "$(cat VERSION)" || { echo "tag $VERSION does not match VERSION file"; exit 1; }
          docker build --build-arg LUMENAUREUM_BUILD=${GITHUB_SHA::7} -t lumenaureum:release .
          test "$(docker image inspect --format '{{.Architecture}}' lumenaureum:release)" = "${{ matrix.arch }}"
      - name: Scan the exact image that will be published (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8   # v0.36.0
        with: { image-ref: "lumenaureum:release", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - name: Push that image under its platform tag
        id: push
        env:
          IMAGE: ghcr.io/lumenaureum/lumenaureum
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker tag lumenaureum:release $IMAGE:$VERSION-${{ matrix.arch }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push $IMAGE:$VERSION-${{ matrix.arch }}
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:$VERSION-${{ matrix.arch }})
          echo "digest=${REF#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed $REF" >> "$GITHUB_STEP_SUMMARY"
      - name: List everything in the image (SBOM, ${{ matrix.arch }})
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c   # v0.24.3
        with: { image: "lumenaureum:release", format: spdx-json, output-file: sbom.spdx.json, upload-artifact: false, upload-release-assets: false }
      - name: Sign and publish the SBOM with the image (${{ matrix.arch }})
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e   # v4.1.0
        with:
          subject-name: ghcr.io/lumenaureum/lumenaureum
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Sign and publish how the image was built (${{ matrix.arch }})
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ghcr.io/lumenaureum/lumenaureum
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  publish-index:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da   # v3.7.0 (verifies cosign's checksum)
      - name: Publish one tag for both platforms and sign it
        env:
          IMAGE: ghcr.io/lumenaureum/lumenaureum
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          test "$VERSION" = "$(cat VERSION)" || { echo "tag $VERSION does not match VERSION file"; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t $IMAGE:$VERSION $IMAGE:$VERSION-amd64 $IMAGE:$VERSION-arm64
          DIGEST=$IMAGE@sha256:$(docker buildx imagetools inspect --raw $IMAGE:$VERSION | sha256sum | cut -d' ' -f1)
          docker buildx imagetools inspect $DIGEST
          cosign sign --yes --recursive "$DIGEST"
          echo "Published $DIGEST (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
