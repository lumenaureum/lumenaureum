# CodeQL code scanning: Python and the gallery viewer's JavaScript, on every push, pull request, and once a week.
# Results appear on the Security tab. Every action is pinned by commit.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066   # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066   # v4.39.3
        with:
          category: /language:${{ matrix.language }}
